name: Apply v1.5.4 source patch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_v154.py

      - name: Commit and tag v1.5.4
        run: |
          if git diff --quiet; then
            echo "nothing to commit, already patched"
            exit 0
          fi
          git config user.name "didi-ci"
          git config user.email "didi-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1.5.4): 锁屏先上滑露出 PIN 键盘，节点/坐标/root 三级解锁 + 45 秒解锁预算"
          git push origin HEAD:main
          if git rev-parse -q --verify refs/tags/v1.5.4 >/dev/null; then
            echo "tag already exists"
          else
            git tag v1.5.4
            git push origin v1.5.4
          fi
