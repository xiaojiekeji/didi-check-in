name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Ensure platform 34 and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, relying on preinstalled packages"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Compile log tail (always visible in job summary)
        if: always()
        run: |
          {
            echo ""
            echo "### key lines"
            echo '```text'
            grep -n -E "FAILURE|FAILED|error:|e: |An exception|What went wrong|Execution failed|Caused by|Could not|Unsupported" build.log 2>/dev/null | head -n 60 || echo "grep none"
            echo '```'
            echo "### first lines around failure"
            echo '```text'
            grep -n "FAILURE: Build failed" build.log 2>/dev/null | head -n 1 || true
            echo '```'
            echo "### log tail 200"
            echo '```text'
            tail -n 200 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show APK info
        run: ls -lh app/build/outputs/apk/debug/

      - name: Verify signing certificate (fixed keystore)
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)"
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "apk=$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          {
            echo "### APK 签名证书指纹"
            echo '```text'
            grep -E "SHA-256 digest|SHA-1 digest|Signer #1 certificate DN" cert.txt || cat cert.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: didi-check-in-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
