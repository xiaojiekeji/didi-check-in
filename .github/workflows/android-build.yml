name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build manifest
        run: |
          set -e
          cat tools/v158_env.txt
          URL=$(sed -n '1p' tools/v158_env.txt)
          SHA=$(sed -n '2p' tools/v158_env.txt)
          TAG=$(sed -n '3p' tools/v158_env.txt)
          echo "TAR_URL=$URL" >> $GITHUB_ENV
          echo "TAR_SHA=$SHA" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Apply source
        run: |
          set -o pipefail
          curl -fSL --retry 3 -o /tmp/src.tar.gz "$TAR_URL"
          echo "$TAR_SHA  /tmp/src.tar.gz" | sha256sum -c -
          tar xzf /tmp/src.tar.gz -C .
          JAVA=app/src/main/java/com/doubao/autocheckin/CheckinAccessibilityService.java
          if grep -q "nodeFirstPass" "$JAVA"; then
            echo "源码已内置改动，无需打补丁"
          else
            if git apply --check tools/v158_service.patch; then
              git apply tools/v158_service.patch
              echo "服务类补丁已应用"
            else
              echo "补丁无法应用，中止构建"
              exit 1
            fi
          fi
          echo "--- version ---"
          grep -n "versionName\|versionCode" app/build.gradle
          echo "--- 快路径 ---"
          grep -c "nodeFirstPass" "$JAVA"
          echo "--- travelBottom ---"
          grep -c "travelBottom" "$JAVA"
          echo "--- su 绝对路径 ---"
          grep -c "/debug_ramdisk/su" "$JAVA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Ensure platform 34 and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Compile log tail (always visible in job summary)
        if: always()
        run: |
          {
            echo ""
            echo "### key lines"
            echo '```text'
            grep -n -E "FAILURE|FAILED|error:|e: |An exception|What went wrong|Execution failed|Caused by|Could not|Unsupported" build.log 2>/dev/null | head -n 60 || echo "grep none"
            echo '```'
            echo "### log tail 200"
            echo '```text'
            tail -n 200 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump build error to repo (readable without login)
        if: failure()
        run: |
          set +e
          {
            grep -n -E "error:|FAILURE|What went wrong|Execution failed|Caused by|Could not|Unsupported|e: " build.log 2>/dev/null | head -n 80
            echo "----- log tail 150 -----"
            tail -n 150 build.log 2>/dev/null
          } > /tmp/err.txt
          cp /tmp/err.txt tools/last-build-error.txt
          git config user.email "ci@local"
          git config user.name "ci-bot"
          git add tools/last-build-error.txt
          git commit -m "ci: build error dump [skip ci]"
          git push
          exit 1

      - name: Show APK info
        run: ls -lh app/build/outputs/apk/debug/

      - name: Verify signing certificate (fixed keystore)
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)"
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          echo "apk=$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          {
            echo "### APK 签名证书指纹"
            echo '```text'
            grep -E "SHA-256 digest|Signer #1 certificate DN" cert.txt || cat cert.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: didi-check-in-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (tag build)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk

      - name: Publish release from manifest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            自动构建产物（固定签名，可直接覆盖安装）。
          files: app/build/outputs/apk/debug/*.apk
