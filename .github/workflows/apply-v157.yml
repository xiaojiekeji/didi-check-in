name: Apply v1.5.7 UI patch and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if release already has the APK
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets="$(gh release view v1.5.7 --json assets -q '.assets[].name' 2>/dev/null || true)"
          if echo "$assets" | grep -q "app-debug.apk"; then
            echo "release already has APK, skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply UI patch
        if: steps.check.outputs.skip != '1'
        run: python3 tools/apply_v157.py

      - name: Commit patched source (if changed)
        if: steps.check.outputs.skip != '1'
        run: |
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "didi-ci"
          git config user.email "didi-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1.5.7): 立即签到按钮 + 检测升级（国内加速线路）+ 申请 root 授权"
          git push origin HEAD:main || echo "push skipped"

      - name: Set up JDK 17
        if: steps.check.outputs.skip != '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure platform 34 and build-tools
        if: steps.check.outputs.skip != '1'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        if: steps.check.outputs.skip != '1'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        if: steps.check.outputs.skip != '1'
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Verify signing certificate
        if: steps.check.outputs.skip != '1'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)"
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          {
            echo "### APK 签名证书指纹"
            echo '```text'
            grep -E "SHA-256 digest|Signer #1 certificate DN" cert.txt || cat cert.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach APK to release
        if: steps.check.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.7
          name: v1.5.7
          files: app/build/outputs/apk/debug/*.apk
