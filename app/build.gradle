plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doubao.autocheckin'
    compileSdk 34

    defaultConfig {
        applicationId "com.doubao.autocheckin"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}

dependencies {
    // 离线中文文字识别（模型打包进 APK，运行时不联网）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
