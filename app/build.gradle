plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doubao.autocheckin'
    compileSdk 34

    defaultConfig {
        applicationId "com.doubao.autocheckin"
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName "1.5.7"
    }

    // 固定签名：所有构建（debug/release）都用仓库内同一把 keystore，
    // 因此新版本可以直接覆盖安装，不需要卸载，打卡记录不会丢。
    signingConfigs {
        didi {
            storeFile file("../keystore/didi-check-in.p12")
            storeType "PKCS12"
            storePassword project.findProperty("DIDI_STORE_PASSWORD") ?: "didi2026checkin"
            keyAlias project.findProperty("DIDI_KEY_ALIAS") ?: "didi"
            keyPassword project.findProperty("DIDI_KEY_PASSWORD") ?: "didi2026checkin"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.didi
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.didi
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}

dependencies {
    // 离线中文文字识别（模型打包进 APK，运行时不联网）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
