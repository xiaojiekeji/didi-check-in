plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doubao.autocheckin'
    compileSdk 34

    defaultConfig {
        applicationId "com.doubao.autocheckin"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}

dependencies {
}
